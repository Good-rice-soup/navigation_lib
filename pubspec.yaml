name: navigation_lib
description: >-
  A navigation engine for following a predefined GPS route: it tracks the
  device's progress along the route and prepares the geometry for map rendering.

version: 7.0.0

publish_to: 'none'

repository: https://github.com/Good-rice-soup/navigation_lib

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  dart_geohash: ^2.0.2
  flutter:
    sdk: flutter
  # TODO: go pure Dart — this (and the flutter dep) are used only for LatLng.
  google_maps_flutter_platform_interface: ^2.4.0
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0
